<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Tracker</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --raise: #ffffff;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0ca30c; --good-text: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --bad-text: #b42f2f;
  --chip-action: #fdecec; --chip-watch: #fff4dc; --chip-good: #e7f6e7; --chip-info: #edf2fa;
  --accent: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --raise: #222220;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good-text: #0ca30c; --bad-text: #e66767;
    --chip-action: #3a1f1f; --chip-watch: #3a3020; --chip-good: #1d3320; --chip-info: #1f2a3a;
    --accent: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --raise: #222220;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good-text: #0ca30c; --bad-text: #e66767;
  --chip-action: #3a1f1f; --chip-watch: #3a3020; --chip-good: #1d3320; --chip-info: #1f2a3a;
  --accent: #3987e5;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--ring);
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; flex: 1; min-width: 160px; }
header .meta { color: var(--muted); font-size: 12px; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); margin: 0 0 12px; }
.grid { display: grid; gap: 16px; }
.tiles { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 28px; font-weight: 650; margin: 2px 0; letter-spacing: -.01em; }
.tile .sub { font-size: 12px; color: var(--muted); }
.up { color: var(--good-text); } .down { color: var(--bad-text); }
button, select, input { font: inherit; color: var(--ink); background: var(--raise); border: 1px solid var(--ring);
  border-radius: 8px; padding: 7px 12px; }
button { cursor: pointer; } button:hover { border-color: var(--axis); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .6; cursor: progress; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.num, th.num { text-align: right; white-space: nowrap; }
.tick { font-weight: 600; } .name { color: var(--muted); font-size: 12px; max-width: 220px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 11.5px; border-radius: 6px; padding: 2px 6px; color: var(--ink); display: inline-flex; gap: 4px; align-items: baseline; }
.chip.action { background: var(--chip-action); } .chip.watch { background: var(--chip-watch); }
.chip.good { background: var(--chip-good); } .chip.info { background: var(--chip-info); }
.chip b { font-weight: 650; font-size: 10.5px; letter-spacing: .03em; }
.wbar { position: relative; height: 8px; width: 90px; background: var(--grid); border-radius: 4px; display: inline-block; vertical-align: middle; margin-right: 6px; }
.wbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 4px; }
.wbar i.over { background: var(--critical); }
.wbar s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.list li { padding: 8px 10px; border-radius: 8px; background: var(--raise); border: 1px solid var(--ring); }
.small { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tooltip { position: absolute; pointer-events: none; background: var(--raise); border: 1px solid var(--ring);
  border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 3px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: middle; }
.mixrow { display: grid; grid-template-columns: 130px 1fr 90px; gap: 10px; align-items: center; margin: 8px 0; }
.mixbar { position: relative; height: 12px; background: var(--grid); border-radius: 6px; }
.mixbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--c); }
.mixbar s { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); }
.check::before { content: "\2715"; color: var(--critical); margin-right: 6px; font-weight: 700; }
.check.ok::before { content: "\2713"; color: var(--good); }
.empty { color: var(--muted); padding: 12px 0; }
.banner { border-radius: 10px; padding: 10px 12px; background: var(--chip-watch); }
.err { background: var(--chip-action); }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 8px 16px 28px; }
@media (max-width: 640px) {
  .mixrow { grid-template-columns: 90px 1fr 70px; }
  .hide-sm { display: none; }
  .tile .value { font-size: 24px; }
}
</style>
</head>
<body>
<header>
  <h1>Portfolio Tracker</h1>
  <span class="meta" id="asof"></span>
  <button id="refresh" class="primary" title="Sync, prices, review, paper bot, news, Congress">Refresh everything</button>
</header>
<main id="app"><div class="card empty">Loading…</div></main>
<footer>Not financial advice. Delayed public data and simple rules. Nothing here places a trade: you decide, and you place every order yourself.</footer>
<div class="tooltip" id="tip"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = (u) => /^https?:\/\//i.test(String(u || "")) ? esc(u) : "#";
const money = (x, d = 2) => (x < 0 ? "-$" : "$") + Math.abs(+x || 0).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = (x, d = 1) => x == null ? "–" : (x > 0 ? "+" : "") + (+x).toFixed(d) + "%";
const cls = (x) => x == null ? "" : x > 0 ? "up" : x < 0 ? "down" : "";
const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)"];
let S = null, tab = 0, contribute = 0, rtab = null, rsel = "growth";

async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Trader": "1"}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({error: "bad response"}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function load() {
  try {
    S = await api("/api/state" + (contribute ? "?contribute=" + contribute : ""));
    render();
  } catch (e) { $("#app").innerHTML = `<div class="card banner err">Could not load: ${esc(e.message)}</div>`; }
}

// ---------------------------------------------------------------- charts
function lineChart(el, series, opts = {}) {
  const W = 640, H = opts.h || 220, L = 64, R = 12, T = 10, B = 26;
  const all = series.flatMap(s => s.points);
  if (all.length < 2) { el.innerHTML = `<div class="empty">${esc(opts.empty || "Not enough history yet. It fills in one point a day.")}</div>`; return; }
  const dates = [...new Set(all.map(p => p[0]))].sort();
  const xi = Object.fromEntries(dates.map((d, i) => [d, i]));
  let lo = Math.min(...all.map(p => p[1])), hi = Math.max(...all.map(p => p[1]));
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const x = i => L + (W - L - R) * (dates.length === 1 ? 0.5 : i / (dates.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const fmt = opts.fmt || (v => money(v, 0));
  let g = "";
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3, yy = y(v).toFixed(1);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${L - 8}" y="${+yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmt(v))}</text>`;
  }
  g += `<text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${esc(dates[0])}</text>`;
  g += `<text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(dates[dates.length - 1])}</text>`;
  const paths = series.map(s => {
    const d = s.points.map((p, i) => (i ? "L" : "M") + x(xi[p[0]]).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" ");
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span style="--c:${s.color}">${esc(s.name)}</span>`).join("")}</div>` : "";
  el.innerHTML = `${legend}<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "chart")}">${g}${paths}
    <line class="xh" y1="${T}" y2="${H - B}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>
    ${series.map((s, k) => `<circle class="dot${k}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`).join("")}
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg></div>`;
  const svg = $("svg", el), tip = $("#tip");
  const maps = series.map(s => Object.fromEntries(s.points));
  svg.addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(dates.length - 1, Math.round((px - L) / (W - L - R) * (dates.length - 1))));
    const d = dates[i], xx = x(i);
    const xh = $(".xh", svg); xh.setAttribute("x1", xx); xh.setAttribute("x2", xx); xh.setAttribute("visibility", "visible");
    let rows = "";
    series.forEach((s, k) => {
      const c = $(".dot" + k, svg), v = maps[k][d];
      if (v == null) { c.setAttribute("visibility", "hidden"); return; }
      c.setAttribute("cx", xx); c.setAttribute("cy", y(v)); c.setAttribute("visibility", "visible");
      rows += `<div>${series.length > 1 ? `<span style="color:${s.color}">●</span> ${esc(s.name)}: ` : ""}<b>${esc(fmt(v))}</b></div>`;
    });
    tip.innerHTML = `<div class="small">${esc(d)}</div>${rows}`;
    tip.style.display = "block";
    const tx = Math.min(window.innerWidth - tip.offsetWidth - 8, ev.clientX + 14);
    tip.style.left = tx + window.scrollX + "px"; tip.style.top = ev.clientY + window.scrollY - 10 + "px";
  });
  svg.addEventListener("mouseleave", () => { tip.style.display = "none"; svg.querySelectorAll(".xh,circle").forEach(n => n.setAttribute("visibility", "hidden")); });
}

function spark(values) {
  if (!values || values.length < 2) return "";
  const W = 80, H = 22, lo = Math.min(...values), hi = Math.max(...values) || 1;
  const d = values.map((v, i) => (i ? "L" : "M") + (i * W / (values.length - 1)).toFixed(1) + " " + (H - 2 - (H - 4) * (v - lo) / ((hi - lo) || 1)).toFixed(1)).join(" ");
  const col = values[values.length - 1] >= values[0] ? "var(--good)" : "var(--critical)";
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"/></svg>`;
}

// ---------------------------------------------------------------- views
function chip(f) { return `<span class="chip ${esc(f.level)}"><b>${esc(f.level.toUpperCase())}</b>${esc(f.text)}</span>`; }

function setupView() {
  $("#app").innerHTML = `<div class="card"><h2>Welcome</h2>
    <p>Nothing is set up yet. This creates <code>trader/</code> with your two accounts: <b>Questrade</b> for aggressive growth (US stocks) and <b>Wealthsimple</b> for steady dividends. You can change everything later in <code>trader/accounts.json</code>.</p>
    <div class="row"><button class="primary" id="init">Set up my accounts</button>
    <button id="initm">With a medium-term account too</button>
    <button id="demo">Try it with demo holdings</button></div>
    <p class="small">Demo holdings are made up, so you can see the dashboard working. Replace them by importing your real holdings.</p></div>`;
  const go = async (body) => { await api("/api/init", body); await load(); };
  $("#init").onclick = () => go({});
  $("#initm").onclick = () => go({medium: true});
  $("#demo").onclick = async () => { await go({demo: true}); refresh(["congress", "news"]); };
}

function render() {
  if (!S.setup) return setupView();
  const R = S.review, B = S.briefing, P = S.paper;
  const V = B && B.vix;
  $("#asof").textContent = (V ? "VIX " + V.level + " (" + V.regime + ", agent: " + V.agent + ") · " : "") +
    (R.market_as_of ? "prices " + R.market_as_of.replace("T", " ").replace("Z", " UTC") : "no prices yet: press Refresh");
  const accts = R.accounts;
  const noHoldings = accts.every(a => !a.positions.length);
  const todo = R.todo, props = accts.flatMap(a => a.proposals.map(o => ({...o, account: a.name})));
  const hist = S.history;
  let h = "";
  if (noHoldings) h += `<div class="card banner">No holdings yet. Import a CSV or sync Questrade below, then press <b>Refresh everything</b>.</div>`;
  if (R.market_errors && R.market_errors.length) h += `<div class="card banner">Some prices failed: ${esc(R.market_errors.slice(0, 3).join("; "))}</div>`;
  const ps = P && P.stats || {}, pb = P && P.buy_hold || {};
  h += `<section class="grid tiles">
    <div class="card tile"><div class="label">Total (${esc(R.base_currency)})</div><div class="value">${money(R.total, 0)}</div>
      <div class="sub ${cls(R.day_change)}">${money(R.day_change)} (${pct(R.day_pct, 2)}) today</div></div>
    <div class="card tile"><div class="label">Dividend income</div><div class="value">${money(R.income_net / 12, 0)}<span class="small"> /mo</span></div>
      <div class="sub">${money(R.income_net, 0)} a year after US withholding</div></div>
    <div class="card tile"><div class="label">To do</div><div class="value">${todo.length}</div>
      <div class="sub">${props.length} proposed trade${props.length === 1 ? "" : "s"}</div></div>
    <div class="card tile"><div class="label">Paper bot</div><div class="value">${P ? money(P.equity, 0) : "–"}</div>
      <div class="sub">${P && ps.total_pct != null ? `<span class="${cls(ps.total_pct)}">${pct(ps.total_pct)}</span> vs buy-and-hold ${pct(pb.total_pct)}` : "starts on the first Refresh"}</div></div>
  </section>`;
  h += `<section class="grid two">
    <div class="card"><h2>Portfolio value</h2><div id="histChart"></div></div>
    <div class="card"><h2>Mix vs your target</h2>${R.mix.map((m, i) => `
      <div class="mixrow"><div>${esc(m.label)}</div>
        <div class="mixbar" title="${esc(m.label)}: ${m.pct}% now, target ${m.target_pct ?? "–"}%"><i style="--c:${SERIES[i % 3]};width:${Math.min(100, m.pct)}%"></i>${m.target_pct != null ? `<s style="left:calc(${m.target_pct}% - 1px)"></s>` : ""}</div>
        <div class="num">${m.pct.toFixed(0)}% <span class="small">/ ${m.target_pct != null ? m.target_pct.toFixed(0) + "%" : "–"}</span></div></div>`).join("")}
      <p class="small">The tick marks your target. New money goes to whatever is under its target.</p>
      <div class="row"><label for="contrib">Plan a contribution</label><input id="contrib" type="number" min="0" step="50" placeholder="e.g. 500" value="${contribute || ""}" style="width:120px"><button id="plan">Show me</button></div>
      ${contribute && R.contribution_split ? `<p>${money(contribute, 0)} goes: ${Object.entries(R.contribution_split).map(([k, v]) => `<b>${esc((accts.find(a => a.id === k) || {}).name || k)}</b> ${money(v, 0)}`).join(", ")}. The buys are in the proposals below.</p>` : ""}
    </div></section>`;
  h += `<section class="grid two">
    <div class="card"><h2>To do</h2>${todo.length ? `<ul class="list">${todo.map(t => `<li><b>${esc(t.account)}${t.ticker ? " · " + esc(t.ticker) : ""}</b><br>${esc(t.text)}</li>`).join("")}</ul>` : `<div class="empty">Nothing needs action today.</div>`}</div>
    <div class="card"><h2>Proposed trades</h2>${props.length ? `<ul class="list">${props.map(o => `<li><b class="${o.side === "buy" ? "up" : "down"}">${esc(o.side.toUpperCase())}</b> ${esc(o.shares)} <b>${esc(o.ticker)}</b> ~${money(o.value, 0)} ${esc(o.currency)} <span class="small">in ${esc(o.account)}</span><br><span class="small">${esc(o.reason)}</span></li>`).join("")}</ul>
      <p class="small">You place these yourself in Questrade or Wealthsimple, only if you agree. Nothing is sent anywhere.</p>` : `<div class="empty">No trades proposed.</div>`}</div>
  </section>`;
  const a = accts[Math.min(tab, accts.length - 1)];
  h += `<section class="card"><h2>Accounts</h2><div class="tabs" role="tablist">${accts.map((x, i) =>
      `<button role="tab" aria-selected="${i === tab}" data-tab="${i}">${esc(x.name)} · ${money(x.total, 0)}</button>`).join("")}</div>`;
  if (a) {
    h += `<div class="row small" style="margin-bottom:8px">${esc(a.strategy_label)} · ${esc(a.type)} · cash ${money(a.cash, 0)} (${a.cash_pct.toFixed(0)}%) · gain ${a.gain_pct != null ? `<span class="${cls(a.gain_pct)}">${pct(a.gain_pct)}</span>` : "–"} · yield ${a.yield_pct.toFixed(2)}% · score ${a.score ?? "–"} · cap ${a.cap_pct}% per stock</div>`;
    h += settingsView(a, (S.accounts || []).find(x => x.id === a.id));
    if (a.flags.length || a.notes.length) h += `<div class="chips" style="margin-bottom:10px">${a.flags.map(chip).join("")}${a.notes.map(n => chip({level: "info", text: n})).join("")}</div>`;
    h += a.positions.length ? `<div class="scroll"><table><thead><tr><th>Holding</th><th class="num">Value</th><th>Weight</th><th class="num">Gain</th><th class="num">Today</th><th class="num">12 mo</th><th class="num">Yield</th><th class="num">Score</th><th class="hide-sm">1 year</th></tr></thead><tbody>${
      a.positions.map(p => { const m = p.m || {}, cap = a.cap_pct;
        return `<tr><td><div class="tick">${esc(p.ticker)}</div><div class="name">${esc(p.name)}</div>${p.flags.length ? `<div class="chips">${p.flags.map(chip).join("")}</div>` : ""}</td>
        <td class="num">${money(p.value_base, 0)}<div class="small">${esc(p.shares)} @ ${p.price != null ? money(p.price) : "–"} ${esc(p.currency)}</div></td>
        <td><span class="wbar" title="${p.weight}% of the account; cap ${cap}%"><i class="${p.weight > cap ? "over" : ""}" style="width:${Math.min(100, p.weight)}%"></i><s style="left:${Math.min(100, cap)}%"></s></span>${p.weight.toFixed(1)}%</td>
        <td class="num ${cls(p.gain_pct)}">${pct(p.gain_pct)}</td><td class="num ${cls(m.day_pct)}">${pct(m.day_pct, 2)}</td>
        <td class="num ${cls(m.ret_12m)}">${pct(m.ret_12m)}</td><td class="num">${m.yield_pct ? m.yield_pct.toFixed(2) + "%" : "–"}</td>
        <td class="num">${p.score ?? "–"}</td><td class="hide-sm">${spark(m.spark)}</td></tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">No holdings in this account yet.</div>`;
  }
  h += `</section>`;
  h += `<section class="grid two"><div class="card"><h2>Paper trading bot</h2>${paperView(P)}</div>

      <p class="small">Read a filing into rows with <code>python3 trade.py pelosi fetch DOC_ID</code>.</p></div>
  </section>`;
  h += `<section class="card"><h2>Update holdings</h2><div class="grid two">
    <div><p class="small">Upload a holdings CSV (Wealthsimple: Activity → export holdings report; Questrade or any broker: positions export).</p>
      <div class="row"><select id="impAcct">${accts.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select>
      <input id="impFile" type="file" accept=".csv,text/csv"><input id="impFilter" placeholder="filter (e.g. TFSA)" style="width:140px">
      <button id="impGo">Import</button></div></div>
    <div><p class="small">Set an account's cash balance.</p>
      <div class="row"><select id="cashAcct">${accts.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select>
      <input id="cashAmt" type="number" step="0.01" placeholder="amount" style="width:120px"><select id="cashCcy"><option>CAD</option><option>USD</option></select>

    const bad = Object.entries(B.steps).filter(([, v]) => !v.ok);

  }

  const hs = [{name: "Total", color: SERIES[0], points: hist.map(p => [p.date, p.total])}];

  if (P && $("#paperChart")) lineChart($("#paperChart"), [
    {name: "Bot", color: SERIES[0], points: P.equity_curve},
    {name: "Buy and hold", color: SERIES[1], points: P.benchmark_curve || []}], {h: 180, label: "Paper bot vs buy and hold", empty: "The bot's curve starts after its first day."});
  if (S.backtest && $("#btChart")) lineChart($("#btChart"), [
    {name: "Bot", color: SERIES[0], points: S.backtest.equity},
    {name: "Buy and hold", color: SERIES[1], points: S.backtest.benchmark}], {h: 180, label: "Backtest equity"});

    try { await api("/api/cash", {account: $("#cashAcct").value, amount: +$("#cashAmt").value, currency: $("#cashCcy").value}); await load(); }
    catch (e) { $("#msg").innerHTML = `<p class="banner err">${esc(e.message)}</p>`; }
  };
  if (S.crypto && $("#teamChart")) lineChart($("#teamChart"), [
    {name: "Bot team", color: SERIES[0], points: S.crypto.curve.map(c => [c[0], c[1]])},
    {name: "Holding the same coins", color: SERIES[1], points: S.crypto.curve.filter(c => c[2] != null).map(c => [c[0], c[2]])}],
    {h: 180, label: "Crypto bot team vs buy and hold", empty: "The chart starts after a few cycles."});

    const row = S.replay.results[rtab] || {};
    const pick = [[rsel, SERIES[0]], ["S&P 500 (SPY)", SERIES[1]], ["TSX 60 (XIU.TO)", SERIES[2]]];

  if (mcs && $("#mcChart")) lineChart($("#mcChart"), [

    {name: "bad case (5%)", color: SERIES[1], points: mcs.fan.map(f => ["day " + String(f[0]).padStart(3, "0"), f[1]])}],
    {h: 180, label: "Monte Carlo outcome range", fmt: v => money(v, 0)});

  const rg = $("#rpGo"); if (rg) rg.onclick = async () => {
    rg.disabled = true; rg.textContent = "Replaying… (a few minutes with crypto)";
    try { await api("/api/replay", {skip: $("#rpFast") && $("#rpFast").checked ? ["crypto"] : []}); await load(); }
    catch (e) { rg.disabled = false; rg.textContent = "Failed: " + e.message; }
  };
  const kb = $("#teamKill"); if (kb) kb.onclick = async () => {
    if (!confirm("Kill switch: sell every paper position on the next cycle and stop the bot?")) return;
    await api("/api/team/kill", {}); await load();

  const rb = $("#teamResume"); if (rb) rb.onclick = async () => { await api("/api/team/resume", {}); await load(); };

    bt.disabled = true; bt.textContent = "Running… (about a minute)";
    try { await api("/api/backtest", {}); await load(); } catch (e) { bt.textContent = "Failed: " + e.message; }

}

  return `<div class="small">Started ${esc(P.since)} with ${money(P.start_cash, 0)} · market regime <b>${esc(P.regime || "–")}</b> · ${s.trades || 0} closed trades · win rate ${s.win_rate_pct ?? "–"}%</div>
    <div id="paperChart" style="margin-top:8px"></div>

    <p class="small">${esc(P.note)}</p>`;

const RL = {"VIX agent": "VIX agent (S&P 500 or cash)", "growth": "Growth reviewer (Questrade)", "medium": "Medium-term reviewer", "dividend": "Dividend reviewer (Wealthsimple)",
  "stock bot": "Stock bot (ATR)", "crypto team": "Crypto bot team", "Pelosi copycat": "Pelosi copycat"};
const RBENCH = ["S&P 500 (SPY)", "Nasdaq 100 (QQQ)", "TSX 60 (XIU.TO)", "Bitcoin (hold)", "cash"];

const lbl = k => (S.replay && S.replay.labels && S.replay.labels[k]) || RL[k] || k;

function rollingView(R) {
  const ro = R.rolling;
  if (!ro || !ro.table) return "";
  const t = ro.table, keys = Object.keys(t).sort((a, b) => ((t[b].beat_spy ?? -1) - (t[a].beat_spy ?? -1)) || (t[b].avg_pct - t[a].avg_pct));
  return `<p style="margin:16px 0 4px"><b>Does it keep working? Rolling ${ro.horizon_days}-day windows</b> <span class="small">(a new window every ${ro.step_days} days; beating the S&amp;P 500 in most windows is evidence, one good window is luck)</span></p>
    <div class="scroll"><table><thead><tr><th>Strategy</th><th class="num">Beat S&amp;P 500</th><th class="num">Made money</th><th class="num">Average</th><th class="num hide-sm">Median</th><th class="num hide-sm">Best</th><th class="num hide-sm">Worst</th></tr></thead><tbody>
    ${keys.map(k => { const x = t[k]; return `<tr><td>${k.startsWith("mine:") ? "<b>" + esc(lbl(k)) + "</b>" : esc(lbl(k))}</td>
      <td class="num">${x.beat_spy == null ? "–" : x.beat_spy + " of " + x.windows}</td><td class="num">${x.positive} of ${x.windows}</td>
      <td class="num ${cls(x.avg_pct)}">${pct(x.avg_pct)}</td><td class="num hide-sm ${cls(x.median_pct)}">${pct(x.median_pct)}</td>
      <td class="num hide-sm">${pct(x.best_pct)}</td><td class="num hide-sm">${pct(x.worst_pct)}</td></tr>`; }).join("")}
    </tbody></table></div>`;
}

function checksView(R) {
  const c = R.checks || [];
  if (!c.length) return "";
  const bad = c.filter(x => !x.ok);
  return `<p style="margin:16px 0 4px"><b>Self-checks</b> <span class="small">${bad.length ? bad.length + " failed: do not trust these numbers" : "all " + c.length + " passed"}</span></p>
    <ul class="list" style="gap:2px">${c.map(x => `<li class="check ${x.ok ? "ok" : ""}" style="background:none;border:0;padding:2px 0">${esc(x.name)} <span class="small">(${esc(x.detail)})</span></li>`).join("")}</ul>`;
}

function replayView(R) {
  const runBar = `<div class="row" style="margin-bottom:10px"><button id="rpGo" class="primary">${R ? "Run again" : "Run the replay"}</button>
    <label class="small"><input type="checkbox" id="rpFast"> skip crypto (faster)</label>
    <span class="small">Needs internet: Yahoo Finance, Coinbase, the House Clerk.</span></div>`;
  if (!R) return runBar + `<div class="empty">Gives $100 to every strategy 1 week, 2 weeks, 1 month and 6 months before the last Friday close, deciding only with what was known each day, and compares them with holding the S&P 500, the TSX 60, Bitcoin or cash.</div>`;
  const wins = Object.keys(R.results);
  if (!rtab || !R.results[rtab]) rtab = wins[0];
  const row = R.results[rtab], f = row.factors || {};
  const strat = Object.keys(row).filter(k => row[k] && row[k].return_pct !== undefined && !RBENCH.includes(k) && k !== "Pelosi copycat")
    .sort((a, b) => (a.startsWith("mine:") ? -1 : 0) - (b.startsWith("mine:") ? -1 : 0));
  if (!row[rsel]) rsel = strat[0] || "growth";
  const spy = (row["S&P 500 (SPY)"] || {}).return_pct;
  const line = (k, bench) => { const r = row[k]; if (!r) return "";
    return `<tr data-rsel="${esc(k)}" style="cursor:pointer;${k === rsel ? "background:var(--chip-info)" : ""}${bench ? ";color:var(--ink-2)" : ""}">
      <td>${k === rsel ? "▸ " : ""}${k.startsWith("mine:") ? "<b>" + esc(lbl(k)) + "</b>" : esc(lbl(k))}</td><td class="num">${money(r.value)}</td><td class="num ${cls(r.return_pct)}">${pct(r.return_pct, 2)}</td>
      <td class="num hide-sm ${cls(spy == null ? null : r.return_pct - spy)}">${bench || spy == null ? "–" : (r.return_pct - spy >= 0 ? "+" : "") + (r.return_pct - spy).toFixed(1) + " pts"}</td>
      <td class="num hide-sm">${r.trades ?? "–"}</td><td class="num hide-sm">${r.fees != null ? money(r.fees) : "–"}</td><td class="num hide-sm">${r.dividends ? money(r.dividends) : "–"}</td></tr>`; };
  const sel = row[rsel] || {}, n = (row.insights || {})[rsel] || {going_well: [], not_going_well: []};
  const contrib = sel.contrib || [], maxAbs = Math.max(0.01, ...contrib.map(c => Math.abs(c.pnl)));
  const ov = Object.entries(R.overall || {}).sort((a, b) => b[1].beat_spy - a[1].beat_spy);
  return runBar + `<div class="small" style="margin-bottom:8px">As of the close on <b>${esc(R.asof)}</b> · $${esc(R.cash)} each · ${esc(R.account_type)} · run ${esc(R.generated || "")}</div>
    <div class="tabs">${wins.map(w => `<button data-rtab="${esc(w)}" aria-selected="${w === rtab}">${esc(w)} <span class="small">from ${esc(R.results[w].start)}</span></button>`).join("")}</div>
    <div class="small" style="margin-bottom:10px">Backdrop: S&amp;P 500 <b class="${cls(f.spy_pct)}">${pct(f.spy_pct)}</b> · TSX 60 <b class="${cls(f.tsx_pct)}">${pct(f.tsx_pct)}</b> · USD/CAD ${pct(f.usdcad_pct)} · S&amp;P 500 ${f.spy_above_200d ? "above" : "below"} its 200-day average · Pelosi filings posted: ${(f.pelosi_filings || []).length}${f.vix_end != null ? ` · VIX ${f.vix_start != null ? f.vix_start.toFixed(1) + " → " : ""}<b>${f.vix_end.toFixed(1)}</b> (high ${f.vix_max}, now ${esc(f.vix_regime)})` : ""}</div>
    <div class="scroll"><table><thead><tr><th>Strategy (click one)</th><th class="num">Value</th><th class="num">Return</th><th class="num hide-sm">vs S&amp;P 500</th><th class="num hide-sm">Trades</th><th class="num hide-sm">Costs</th><th class="num hide-sm">Dividends</th></tr></thead><tbody>
      ${strat.map(k => line(k)).join("")}
      ${row["Pelosi copycat"] ? `<tr><td colspan="7" class="small" style="padding-top:14px"><b>Separate: following Nancy Pelosi</b> (copies a trade only after its filing was posted)</td></tr>${line("Pelosi copycat")}` : ""}
      <tr><td colspan="7" class="small" style="padding-top:14px"><b>Benchmarks</b> (buy and hold)</td></tr>
      ${RBENCH.map(k => line(k, true)).join("")}
    </tbody></table></div>
    <div class="grid two" style="margin-top:14px">
      <div><b>${esc(lbl(rsel))}</b> vs the S&amp;P 500 and TSX 60<div id="rpChart" style="margin-top:6px"></div></div>
      <div>
        <p style="margin:0 0 4px"><b>Going well</b></p>
        <ul class="list" style="gap:2px">${(n.going_well.length ? n.going_well : ["nothing stood out"]).map(x => `<li class="check ok" style="background:none;border:0;padding:2px 0">${esc(x)}</li>`).join("")}</ul>
        <p style="margin:10px 0 4px"><b>Not going well</b></p>
        <ul class="list" style="gap:2px">${(n.not_going_well.length ? n.not_going_well : ["nothing stood out"]).map(x => `<li class="check" style="background:none;border:0;padding:2px 0">${esc(x)}</li>`).join("")}</ul>
        ${sel.risk ? `<p class="small" style="margin-top:10px">Over ${esc(wins[0])}: volatility ${sel.risk.vol_pct}% a year · Sharpe ${sel.risk.sharpe ?? "–"} · worst drop ${pct(sel.risk.max_dd_pct)} · up days ${sel.risk.up_days_pct}%</p>` : ""}
        ${rsel === "Pelosi copycat" ? `<p class="small">Filings used: ${esc((sel.filings_used || []).join(", ") || "none")} · basket: ${esc((sel.basket || []).join(", ") || "empty")}</p>` : ""}
      </div></div>
    ${contrib.length ? `<p style="margin:14px 0 4px"><b>What drove it</b> <span class="small">(profit or loss per holding, CAD, after costs)</span></p>
      <div class="scroll"><table><tbody>${contrib.slice(0, 10).map(c => `<tr><td class="tick" style="width:90px">${esc(c.ticker)}</td>
        <td><span style="display:inline-block;height:10px;border-radius:4px;vertical-align:middle;width:${(46 * Math.abs(c.pnl) / maxAbs).toFixed(1)}%;background:${c.pnl >= 0 ? "var(--good)" : "var(--critical)"}"></span></td>
        <td class="num ${cls(c.pnl)}" style="width:90px">${money(c.pnl)}</td><td class="small" style="width:70px">${c.held ? "still held" : "closed"}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${(sel.fills || []).length ? `<details style="margin-top:10px"><summary class="small">Last trades (${sel.fills.length})</summary><div class="scroll"><table><thead><tr><th>Day</th><th>Side</th><th>Ticker</th><th class="num">Shares</th><th class="num">Price</th><th class="num">CAD</th></tr></thead><tbody>
      ${sel.fills.slice().reverse().map(x => `<tr><td class="small">${esc(x.day)}</td><td>${esc(x.side)}</td><td class="tick">${esc(x.ticker)}</td><td class="num">${esc(x.shares)}</td><td class="num">${esc(x.price)} ${esc(x.currency)}</td><td class="num">${money(x.cad)}</td></tr>`).join("")}</tbody></table></div></details>` : ""}
    ${rollingView(R)}
    ${vixView(R, wins)}
    ${scenariosView(R, wins)}
    ${mcView(R, rsel)}
    ${ov.length ? `<p style="margin:14px 0 4px"><b>Across all windows</b></p><div class="scroll"><table><thead><tr><th>Strategy</th>${wins.map(w => `<th class="num">${esc(w)}</th>`).join("")}<th class="num">Beat S&amp;P 500</th></tr></thead><tbody>
      ${ov.map(([k, t]) => `<tr><td>${esc(lbl(k))}</td>${wins.map(w => `<td class="num ${cls(t.returns[w])}">${pct(t.returns[w])}</td>`).join("")}<td class="num">${t.beat_spy} of ${t.windows}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${checksView(R)}
    ${(R.errors || []).length ? `<p class="small">Data problems: ${esc(R.errors.slice(0, 4).join("; "))}</p>` : ""}
    <p class="small">1-week and 2-week results are mostly noise; trust the rolling table and the longest windows. Watchlists are today's (hindsight bias). Not financial advice.</p>`;
}

const EVERY = [[1, "every day"], [7, "weekly"], [14, "every 2 weeks"], [28, "monthly"], [91, "quarterly"]];
function settingsView(a, meta) {
  if (!meta || !S.tunable) return "";
  const keys = Object.keys(S.tunable).filter(k => S.tunable[k].strategies.includes(a.strategy));
  const field = k => { const t = S.tunable[k], v = meta.rules[k], d = meta.defaults[k];
    let input;
    if (k === "momentum_months") input = `<select data-rule="${k}">${[1, 3, 6, 12].map(m => `<option value="${m}" ${m == v ? "selected" : ""}>${m} month${m > 1 ? "s" : ""}</option>`).join("")}</select>`;
    else if (k === "review_every_days") input = `<select data-rule="${k}">${EVERY.map(([n, l]) => `<option value="${n}" ${n == v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
    else input = `<input data-rule="${k}" type="number" step="any" min="${t.min}" max="${t.max}" value="${esc(v)}" style="width:90px">`;
    return `<label class="small" style="display:grid;gap:2px">${esc(t.label)} ${v != d ? `<span style="color:var(--accent)">(default ${esc(d)})</span>` : ""}${input}</label>`; };
  return `<details style="margin:0 0 12px"><summary class="small"><b>Strategy settings</b>: what this account's review uses (and the replay's "Your settings" scenario)</summary>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0">${keys.map(field).join("")}</div>
    <div class="row"><button id="rulesSave" data-acct="${esc(a.id)}">Save settings</button><button id="rulesReset" data-acct="${esc(a.id)}">Back to defaults</button><span id="rulesMsg" class="small"></span></div></details>`;
}

function vixView(R, wins) {
  const six = R.results[wins[0]] || {}, names = ["calm", "normal", "nervous", "fear"];
  const rows = Object.keys(six).filter(k => six[k] && six[k].vix_regimes);
  if (!rows.length) return "";
  return `<p style="margin:16px 0 4px"><b>By VIX regime (${esc(wins[0])})</b> <span class="small">(average daily return on days after the VIX closed calm &lt;15, normal 15–20, nervous 20–30, fear 30+; days in brackets)</span></p>
    <div class="scroll"><table><thead><tr><th>Strategy</th>${names.map(n => `<th class="num">${n}</th>`).join("")}<th class="num">Moves with VIX</th></tr></thead><tbody>
    ${rows.map(k => { const v = six[k].vix_regimes; return `<tr><td>${esc(lbl(k))}</td>${names.map(n => v[n].avg_daily_pct == null ? `<td class="num">–</td>` :
      `<td class="num ${cls(v[n].avg_daily_pct)}">${pct(v[n].avg_daily_pct, 2)} <span class="small">(${v[n].days}d)</span></td>`).join("")}<td class="num">${v.corr_with_vix ?? "–"}</td></tr>`; }).join("")}
    </tbody></table></div><p class="small">"Moves with VIX" is the correlation of daily returns with daily VIX changes: near -1 falls when fear rises, near 0 doesn't care.</p>`;
}

function scenariosView(R, wins) {
  const sc = R.scenarios || [];
  if (!sc.length) return "";
  const best = {};
  const ret = (x, w) => x.results[w] ? x.results[w].return_pct : null;
  sc.forEach(x => { const v = ret(x, wins[0]); if (v != null && (!(x.strategy in best) || v > best[x.strategy])) best[x.strategy] = v; });
  return `<p style="margin:16px 0 4px"><b>Scenarios: same strategy, different settings</b> <span class="small">(inputs on the left, outputs on the right; best ${esc(wins[0])} result per strategy in bold)</span></p>
    <div class="scroll"><table><thead><tr><th>Strategy</th><th>Scenario</th><th class="hide-sm">Changed inputs</th>${wins.map(w => `<th class="num">${esc(w)}</th>`).join("")}<th class="num hide-sm">Sharpe</th><th class="num hide-sm">Worst drop</th></tr></thead><tbody>
    ${sc.map(x => { const rk = x.risk || {}; const top = ret(x, wins[0]) != null && ret(x, wins[0]) === best[x.strategy];
      return `<tr><td class="small">${esc(x.strategy)}</td><td>${top ? "<b>" : ""}${esc(x.name)}${top ? "</b>" : ""}</td>
        <td class="small hide-sm">${esc(Object.entries(x.inputs).map(([k, v]) => k.replace(/_/g, " ") + " " + v).join(", ") || "defaults")}</td>
        ${wins.map(w => `<td class="num ${cls(ret(x, w))}">${ret(x, w) == null ? "n/a" : pct(ret(x, w))}</td>`).join("")}
        <td class="num hide-sm">${rk.sharpe ?? "–"}</td><td class="num hide-sm">${pct(rk.max_dd_pct)}</td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="small">Save settings on an account above, or add scenarios to <code>trader/replay/scenarios.json</code>, then run the replay again. Pick settings that win across windows, not just one.</p>`;
}

function mcView(R, rsel) {
  const mc = R.monte_carlo;
  if (!mc) return "";
  const order = Object.keys(mc.strategies).filter(k => k.startsWith("mine:")).concat(Object.keys(RL), RBENCH).filter(k => mc.strategies[k]);
  return `<p style="margin:16px 0 4px"><b>Monte Carlo: the next ${mc.horizon_days} trading days</b> <span class="small">(${mc.runs.toLocaleString()} runs, ${mc.block_days}-day blocks of each strategy's own daily returns over the last ${mc.sample_days} days)</span></p>
    <div class="grid two"><div class="scroll"><table><thead><tr><th>$${esc(R.cash)} becomes</th><th class="num">Bad (5%)</th><th class="num">Median</th><th class="num">Good (95%)</th><th class="num">P(profit)</th><th class="num">P(beat S&amp;P)</th></tr></thead><tbody>
      ${order.map(k => { const m = mc.strategies[k]; return `<tr data-rsel="${esc(k)}" style="cursor:pointer;${k === rsel ? "background:var(--chip-info)" : ""}"><td>${esc(lbl(k))}</td>
        <td class="num">${money(m.p5)}</td><td class="num"><b>${money(m.median)}</b></td><td class="num">${money(m.p95)}</td>
        <td class="num">${m.prob_profit_pct}%</td><td class="num">${m.prob_beat_bench_pct == null ? "–" : m.prob_beat_bench_pct + "%"}</td></tr>`; }).join("")}
    </tbody></table></div>
    <div>${mc.strategies[rsel] ? `<b>${esc(lbl(rsel))}</b>: range of outcomes<div id="mcChart" style="margin-top:6px"></div>
      <p class="small">Typical worst drop along the way ${pct(mc.strategies[rsel].median_max_dd_pct)}; in a bad run ${pct(mc.strategies[rsel].bad_max_dd_pct)}. Chance of losing more than 10%: ${mc.strategies[rsel].prob_loss_10_pct}%.</p>` : `<div class="empty">No daily curve for this strategy, so no simulation.</div>`}</div></div>
    <p class="small">A bootstrap of one past period shows the spread that period implies. It is not a forecast.</p>`;
}

function cryptoView(C) {
  if (!C) return `<div class="empty">Not started. Four roles (Scanner, Analyst, Risk Manager, Executor) trade 10 coins every 15 minutes with fake money. Start it in a terminal: <code>python3 trade.py crypto run</code>. The guide is <code>docs/crypto-bot-team.md</code>.</div>`;
  const s = C.summary || {}, t = C.today || {}, pos = Object.entries(C.positions || {});
  const n = (x, f) => x == null ? "–" : f(x);
  return `<div class="row" style="justify-content:space-between;margin-bottom:8px">
      <div class="small"><b>${esc(C.mode)}</b> · last cycle ${C.last_cycle ? esc(new Date(C.last_cycle * 1000).toLocaleString()) : "–"}
        · kill switch ${C.kill ? `<b class="down">ON</b> (${esc(C.kill.reason)})` : "off"}</div>
      ${C.kill ? `<button id="teamResume">Turn the bot back on</button>` : `<button id="teamKill" style="border-color:var(--critical);color:var(--bad-text)">Kill switch</button>`}</div>
    <div class="grid two"><div><div id="teamChart"></div></div><div>
      <table><tbody>
        <tr><td>Trades in total (today)</td><td class="num">${s.trades} (${t.trades})</td></tr>
        <tr><td>Win rate</td><td class="num">${n(s.win_rate_pct, x => x + "%")}</td></tr>
        <tr><td>Average win / loss</td><td class="num">${n(s.avg_win, x => money(x))} / ${n(s.avg_loss, x => money(x))}</td></tr>
        <tr><td>P&amp;L (fees and slippage)</td><td class="num ${cls(s.pnl)}">${money(s.pnl)} (${money(s.fees_slippage)})</td></tr>
        <tr><td>Max drawdown</td><td class="num">${pct(s.max_drawdown_pct, 2)}</td></tr>
        <tr><td>Bot vs holding the same coins</td><td class="num"><span class="${cls(s.bot_return_pct)}">${pct(s.bot_return_pct, 2)}</span> vs <span class="${cls(s.hold_return_pct)}">${pct(s.hold_return_pct, 2)}</span></td></tr>
        <tr><td>Errors / downtime gaps</td><td class="num">${s.errors} / ${s.downtime}</td></tr>
      </tbody></table></div></div>
    ${pos.length ? `<p style="margin:12px 0 4px"><b>Open</b></p><div class="scroll"><table><thead><tr><th>Coin</th><th class="num">Qty</th><th class="num">Entry</th><th class="num">Stop</th><th class="num">Target</th></tr></thead><tbody>${pos.map(([c, p]) => `<tr><td class="tick">${esc(c)}</td><td class="num">${esc(p.qty)}</td><td class="num">${money(p.entry)}</td><td class="num">${money(p.stop)}</td><td class="num">${money(p.tp)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    ${(C.trades || []).length ? `<p style="margin:12px 0 4px"><b>Last trades</b></p><div class="scroll"><table><thead><tr><th>Closed</th><th>Coin</th><th class="num">P&amp;L</th><th>Why</th></tr></thead><tbody>${C.trades.map(r => `<tr><td class="small">${esc(r.closed_at)}</td><td class="tick">${esc(r.asset)}</td><td class="num ${cls(+r.pnl)}">${money(+r.pnl)}</td><td class="small">${esc(r.exit_reason)}</td></tr>`).join("")}</tbody></table></div>` : ""}
    <p class="small">Fake money only. Paper fills look better than real ones. Give it 2 to 4 weeks before judging, and keep every losing trade in the log.</p>`;
}

function backtestView(bt) {
  if (!bt) return `<div class="empty">Test the bot's rule on the last 5 years of 30 large US stocks before trusting it.</div><button id="btGo">Run the backtest</button>`;
  const r = (x) => x ? `${pct(x.total_pct)} total · ${pct(x.cagr_pct)} a year · Sharpe ${x.sharpe ?? "–"} · worst drop ${pct(x.max_dd_pct)}` : "–";
  return `<div class="small">${esc(bt.from)} to ${esc(bt.to)}</div><div id="btChart" style="margin-top:8px"></div>
    <p><b>Bot:</b> ${r(bt.bot)}<br><b>Buy and hold:</b> ${r(bt.buy_hold)}</p>
    <div class="scroll"><table><thead><tr><th>Year</th><th class="num">Bot</th><th class="num">Buy and hold</th></tr></thead><tbody>${(bt.per_year || []).map(y => `<tr><td>${esc(y.year)}</td><td class="num ${cls(y.bot_pct)}">${pct(y.bot_pct)}</td><td class="num ${cls(y.buy_hold_pct)}">${pct(y.buy_hold_pct)}</td></tr>`).join("")}</tbody></table></div>
    <p class="small">Simulated on past prices with 5 bps costs. Past results do not predict future ones.</p><button id="btGo">Run it again</button>`;
}

async function importCsv() {
  const f = $("#impFile").files[0];
  if (!f) { $("#msg").innerHTML = `<p class="banner">Choose a CSV file first.</p>`; return; }
  try {
    const r = await api("/api/import", {account: $("#impAcct").value, csv: await f.text(), filter: $("#impFilter").value});
    $("#msg").innerHTML = `<p class="banner">Imported ${r.imported} holdings (${r.skipped} rows skipped). Press Refresh for prices.</p>`;
    await load();
  } catch (e) { $("#msg").innerHTML = `<p class="banner err">${esc(e.message)}</p>`; }
}

async function refresh(skip = []) {
  const b = $("#refresh"); b.disabled = true; b.textContent = "Refreshing…";
  try { await api("/api/refresh", {skip}); await load(); }
  catch (e) { alert("Refresh failed: " + e.message); }
  finally { b.disabled = false; b.textContent = "Refresh everything"; }
}
$("#refresh").onclick = () => refresh();
load();
</script>
