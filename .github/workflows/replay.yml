name: replay

# Runs the $100 point-in-time replay on GitHub's machines (which can reach
# Yahoo Finance, Coinbase and the House Clerk), every Saturday after
# Friday's close, or on demand from the Actions tab. The report goes to the
# run's summary page, an artifact, and the replay-results branch.
# It uses the default watchlists only: no personal holdings are involved.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "replay (one as-of date), walk-forward (five periods 2019-2026, needs a label), build-signals (SEC + Congress data), long-history (2000-2017 fund test)"
        required: false
        default: "replay"
        type: choice
        options: ["replay", "walk-forward", "build-signals", "discover", "forward", "long-history", "sessions"]
      asof:
        description: "As-of date, YYYY-MM-DD (blank = the latest Friday close)"
        required: false
        default: ""
      skip:
        description: "Parts to skip: crypto, pelosi, or 'crypto pelosi' (blank = run everything)"
        required: false
        default: ""
      windows:
        description: "Windows, e.g. 24m,12m,6m (blank = 12m,6m,3m,1m,2w,1w)"
        required: false
        default: ""
      sec_user_agent:
        description: "Optional 'Name email' for SEC downloads (read privately, hidden in logs, never saved)"
        required: false
        default: ""
      label:
        description: "Research label, e.g. older-period (saves to research/<label>.md instead of the weekly report)"
        required: false
        default: ""
  schedule:
    - cron: "17 13 * * 6"  # Saturdays, 13:17 UTC: the weekly replay
    - cron: "41 22 * * 1-5"  # weekdays after the close: archive the idea lists (discover)
    - cron: "23 7 3 * *"  # the 3rd of each month: refresh the Congress and insider signals

permissions:
  contents: write

concurrency:
  group: replay-${{ inputs.label || 'weekly' }}
  cancel-in-progress: false

jobs:
  replay:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 13 * * 6') || inputs.mode == 'replay' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pdftotext (reads the Congress disclosure PDFs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Set up trader/ with the default watchlists
        run: python trade.py init
      - name: Dated signals (Congress, insiders, 8-K news) from the replay-results branch
        run: |
          mkdir -p signals
          git fetch -q origin replay-results || true
          for f in congress.json.gz insiders.json.gz insiders_recent.json.gz events.json.gz eps.json.gz f13.json.gz f13_old.json.gz fundamentals.json.gz; do
            git show "origin/replay-results:signals/$f" > "signals/$f" 2>/dev/null || rm -f "signals/$f"
          done
      - name: Replay $100 in every strategy
        env:
          ASOF: ${{ inputs.asof }}
          SKIP: ${{ inputs.skip }}
          WINDOWS: ${{ inputs.windows }}
          LABEL: ${{ inputs.label }}
        run: |
          args=()
          if [ -n "$ASOF" ]; then
            [[ "$ASOF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "asof must be YYYY-MM-DD"; exit 1; }
            args+=(--asof "$ASOF")
          fi
          if [ -n "$SKIP" ]; then
            args+=(--skip)
            for part in $SKIP; do
              case "$part" in crypto|pelosi) args+=("$part") ;; *) echo "skip: crypto or pelosi only"; exit 1 ;; esac
            done
          fi
          if [ -n "$WINDOWS" ]; then
            [[ "$WINDOWS" =~ ^[0-9]+[dwmy](,[0-9]+[dwmy])*$ ]] || { echo "windows like 24m,12m,6m"; exit 1; }
            args+=(--windows "$WINDOWS")
          fi
          if [ -n "$LABEL" ]; then
            [[ "$LABEL" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "label: lowercase letters, digits and dashes"; exit 1; }
          fi
          python trade.py replay --strict --signals signals "${args[@]}"
      - name: Summary page
        if: always()
        run: |
          if [ -f trader/replay/report.md ]; then
            cat trader/replay/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: see the replay step's log." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-report
          path: trader/replay/report.*
          if-no-files-found: ignore
      - name: Save to the replay-results branch
        env:
          LABEL: ${{ inputs.label }}
        run: |
          asof=$(python -c "import json; print(json.load(open('trader/replay/report.json'))['asof'])")
          mkdir -p "$RUNNER_TEMP/out"
          cp trader/replay/report.md trader/replay/report.json "$RUNNER_TEMP/out/"
          git config user.name "replay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin replay-results 2>/dev/null; then
            git checkout -q -B replay-results FETCH_HEAD
          else
            git checkout -q --orphan replay-results
            git rm -rqf .
          fi
          if [ -n "$LABEL" ]; then  # a research run: never replaces the weekly report
            mkdir -p research
            cp "$RUNNER_TEMP/out/report.md" "research/$LABEL.md"
            cp "$RUNNER_TEMP/out/report.json" "research/$LABEL.json"
            git add "research/$LABEL.md" "research/$LABEL.json"
            git commit -qm "Research run $LABEL as of $asof" || echo "no change"
          else
            mkdir -p history
            cp "$RUNNER_TEMP/out/report.md" "$RUNNER_TEMP/out/report.json" .
            cp "$RUNNER_TEMP/out/report.md" "history/$asof.md"
            git add report.md report.json "history/$asof.md"
            git commit -qm "Replay as of the close on $asof" || echo "no change"
          fi
          for i in 1 2 3; do git push -q origin replay-results && break; git pull -q --rebase origin replay-results; done

  # ---------------------------------------------------------------- walk-forward
  # Download 10 years of prices once (every S&P 500 member since 2016 + index
  # funds + a Canadian list), replay five periods in parallel (including the 2020
  # crash and the 2022 bear market), combine them into research/<label>/.

  wf-data:
    if: ${{ inputs.mode == 'walk-forward' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check inputs
        env:
          LABEL: ${{ inputs.label }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          [[ "$LABEL" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "label: lowercase letters, digits and dashes"; exit 1; }
          [[ -z "$WINDOWS" || "$WINDOWS" =~ ^[0-9]+[dwmy](,[0-9]+[dwmy])*$ ]] || { echo "windows like 24m,12m"; exit 1; }
      - name: Download 10 years of prices
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          python trade.py init
          python .claude/skills/trader-replay/replay.py --history 10y --save-data market --windows 1m \
            --no-rolling --skip crypto pelosi > /dev/null
          ls market | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: market
          retention-days: 3

  wf-period:
    needs: wf-data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        asof: ["2019-10-18", "2020-10-16", "2022-10-14", "2024-10-18", "2026-10-16"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: market-data
          path: market
      - name: Dated signals (Congress, insiders, 8-K news) from the replay-results branch
        run: |
          mkdir -p signals
          git fetch -q origin replay-results || true
          for f in congress.json.gz insiders.json.gz insiders_recent.json.gz events.json.gz eps.json.gz f13.json.gz f13_old.json.gz fundamentals.json.gz; do
            git show "origin/replay-results:signals/$f" > "signals/$f" 2>/dev/null || rm -f "signals/$f"
          done
          ls -la signals
      - name: Replay the period ending ${{ matrix.asof }}
        env:
          WINDOWS: ${{ inputs.windows || '24m,12m,6m,1m' }}
          ASOF: ${{ matrix.asof }}
        run: |
          python trade.py init
          mkdir -p out
          status=0
          python .claude/skills/trader-replay/replay.py --offline market --history 10y --asof "$ASOF" \
            --windows "$WINDOWS" --skip crypto pelosi --signals signals --strict > /dev/null || status=$?
          cp trader/replay/report.md "out/report-$ASOF.md"
          cp trader/replay/report.json "out/report-$ASOF.json"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: period-${{ matrix.asof }}
          path: out
          if-no-files-found: ignore

  wf-stats:
    # 28 overlapping 12-month windows, a new one every quarter, all inside the training
    # years (ending a year before the latest Friday), then confidence ranges and a reality check.
    needs: wf-data
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: market-data
          path: market
      - name: Dated signals
        run: |
          mkdir -p signals
          git fetch -q origin replay-results || true
          for f in congress.json.gz insiders.json.gz insiders_recent.json.gz events.json.gz eps.json.gz f13.json.gz f13_old.json.gz fundamentals.json.gz; do
            git show "origin/replay-results:signals/$f" > "signals/$f" 2>/dev/null || rm -f "signals/$f"
          done
      - name: Rolling windows inside the training years
        run: |
          python trade.py init
          asof=$(date -u -d "$(date -u +%Y-%m-%d) -1 year -3 days" +%Y-%m-%d)
          python .claude/skills/trader-replay/replay.py --offline market --history 10y --asof "$asof" --windows 12m \
            --rolling-spec 365,91,28 --skip crypto pelosi --signals signals > /dev/null
          mkdir -p out
          cp trader/replay/report.json out/stats-report.json
          python scripts/stats.py out/stats.md out/stats-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: period-stats
          path: out

  wf-combine:
    needs: [wf-period, wf-stats]
    if: ${{ always() && inputs.mode == 'walk-forward' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: period-*
          path: out
          merge-multiple: true
      - name: Walk-forward table
        run: |
          python scripts/walkforward.py out/summary.md out/report-*.json
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
          [ -f out/stats.md ] && cat out/stats.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save to the replay-results branch
        env:
          LABEL: ${{ inputs.label }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cp out/* "$RUNNER_TEMP/out/"
          git config user.name "replay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin replay-results
          git checkout -q -B replay-results FETCH_HEAD
          mkdir -p "research/$LABEL"
          cp "$RUNNER_TEMP"/out/summary.md "$RUNNER_TEMP"/out/report-*.md "$RUNNER_TEMP"/out/report-*.json "research/$LABEL/"
          cp "$RUNNER_TEMP"/out/stats.md "research/$LABEL/" 2>/dev/null || true
          git add "research/$LABEL"
          git commit -qm "Walk-forward research: $LABEL" || echo "no change"
          for i in 1 2 3; do git push -q origin replay-results && break; git pull -q --rebase origin replay-results; done

  # ---------------------------------------------------------------- long-history
  # The fund strategies from 2000 to 2017, before any period anything was chosen on (older
  # Treasury funds and FRED exchange rates stitched in), saved to research/<label>/.

  long-history:
    if: ${{ inputs.mode == 'long-history' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay 2000-2017
        env:
          LABEL: ${{ inputs.label || 'long-history' }}
        run: |
          [[ "$LABEL" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "label: lowercase letters, digits and dashes"; exit 1; }
          mkdir -p signals  # the copycat's 13Fs (XML since 2013, plain text before) for C4 back to 2000
          git fetch -q origin replay-results || true
          for f in congress.json.gz insiders.json.gz insiders_recent.json.gz events.json.gz eps.json.gz f13.json.gz f13_old.json.gz fundamentals.json.gz; do
            git show "origin/replay-results:signals/$f" > "signals/$f" 2>/dev/null || rm -f "signals/$f"
          done
          python .claude/skills/trader-replay/replay.py --long out --signals signals > /dev/null
          python scripts/stats.py out/long-stats.md out/long.json > /dev/null
          cat out/long.md out/long-stats.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save to the replay-results branch
        env:
          LABEL: ${{ inputs.label || 'long-history' }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cp out/* "$RUNNER_TEMP/out/"
          git config user.name "replay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin replay-results
          git checkout -q -B replay-results FETCH_HEAD
          mkdir -p "research/$LABEL"
          cp "$RUNNER_TEMP"/out/long.md "$RUNNER_TEMP"/out/long.json "$RUNNER_TEMP"/out/long-stats.md "research/$LABEL/"
          git add "research/$LABEL"
          git commit -qm "Long history: $LABEL" || echo "no change"
          for i in 1 2 3; do git push -q origin replay-results && break; git pull -q --rebase origin replay-results; done

  # ---------------------------------------------------------------- sessions
  # Overseas sessions -> New York / Toronto day trade, on paper: about 2 years of hourly bars.

  sessions:
    if: ${{ inputs.mode == 'sessions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backtest every version
        env:
          LABEL: ${{ inputs.label || 'sessions' }}
        run: |
          [[ "$LABEL" =~ ^[a-z0-9-]{1,40}$ ]] || { echo "label: lowercase letters, digits and dashes"; exit 1; }
          python .claude/skills/trader-replay/sessions.py backtest --out out > /dev/null
          cat out/sessions.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save to the replay-results branch
        env:
          LABEL: ${{ inputs.label || 'sessions' }}
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cp out/* "$RUNNER_TEMP/out/"
          git config user.name "replay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin replay-results
          git checkout -q -B replay-results FETCH_HEAD
          mkdir -p "research/$LABEL"
          cp "$RUNNER_TEMP"/out/sessions.md "$RUNNER_TEMP"/out/sessions.json "research/$LABEL/"
          git add "research/$LABEL"
          git commit -qm "Sessions research: $LABEL" || echo "no change"
          for i in 1 2 3; do git push -q origin replay-results && break; git pull -q --rebase origin replay-results; done

  # ---------------------------------------------------------------- build-signals
  # Every House member's trades since 2015 and every insider purchase (SEC Form 4
  # bulk data) since 2015, saved to replay-results/signals/ for the walk-forward.

  sig-congress:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 7 3 * *') || (inputs.mode == 'build-signals' && !contains(inputs.skip, 'congress')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: House PTRs, every member, 2015 on
        run: python .claude/skills/trader-replay/signals.py congress --years "2015-$(date +%Y)" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: sig-congress
          path: out/congress.json.gz

  sig-insiders:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 7 3 * *') || (inputs.mode == 'build-signals' && !contains(inputs.skip, 'insiders')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SEC insider purchases, 2015 on
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Keneisha 140374931+Keneisha3@users.noreply.github.com' }}
        run: |
          ua=$(jq -r '.inputs.sec_user_agent // ""' "$GITHUB_EVENT_PATH")  # from the trigger, not printed
          if [ -n "$ua" ]; then echo "::add-mask::$ua"; export SEC_USER_AGENT="$ua"; fi
          [ -n "$SEC_USER_AGENT" ] || { echo "no SEC user agent: pass sec_user_agent or set the SEC_USER_AGENT secret"; exit 1; }
          y=$(date +%Y); q=$(( ($(date +%-m) - 1) / 3 ))
          if [ "$q" -eq 0 ]; then y=$((y - 1)); q=4; fi
          python .claude/skills/trader-replay/signals.py insiders --quarters "2015q1-${y}q${q}" --out out
          since=$(python -c "import gzip,json,datetime; r=json.load(gzip.open('out/insiders.json.gz','rt'))['rows']; print((datetime.date.fromisoformat(max(x[0] for x in r))+datetime.timedelta(days=1)).isoformat())")
          python .claude/skills/trader-replay/signals.py insiders-recent --since "$since" --sp500 --out out
      - uses: actions/upload-artifact@v4
        with:
          name: sig-insiders
          path: out/insiders*.json.gz

  sig-events:
    # every 8-K (company news filed with the SEC) since 2015 for every S&P 500 member since 2014
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 7 3 * *') || (inputs.mode == 'build-signals' && !contains(inputs.skip, 'events')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SEC 8-K news events
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Keneisha 140374931+Keneisha3@users.noreply.github.com' }}
        run: |
          ua=$(jq -r '.inputs.sec_user_agent // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$ua" ]; then echo "::add-mask::$ua"; export SEC_USER_AGENT="$ua"; fi
          python .claude/skills/trader-replay/signals.py events --out out
      - uses: actions/upload-artifact@v4
        with:
          name: sig-events
          path: out/events.json.gz

  sig-eps:
    # quarterly diluted EPS (first filed in a 10-Q or 10-K) for every S&P 500 member since 2014
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 7 3 * *') || (inputs.mode == 'build-signals' && !contains(inputs.skip, 'eps')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SEC XBRL earnings per share
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Keneisha 140374931+Keneisha3@users.noreply.github.com' }}
        run: |
          ua=$(jq -r '.inputs.sec_user_agent // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$ua" ]; then echo "::add-mask::$ua"; export SEC_USER_AGENT="$ua"; fi
          python .claude/skills/trader-replay/signals.py eps --out out
      - uses: actions/upload-artifact@v4
        with:
          name: sig-eps
          path: out/eps.json.gz

  sig-13f:
    # the upstream copycat's 23 investors: every 13F-HR since mid 2013, top 50 stocks each
    # also every Saturday: the live copycat line checks for new 13Fs weekly, like the backtest
    if: ${{ (github.event_name == 'schedule' && (github.event.schedule == '23 7 3 * *' || github.event.schedule == '17 13 * * 6')) || (inputs.mode == 'build-signals' && !contains(inputs.skip, '13f')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SEC 13F holdings of famous investors
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Keneisha 140374931+Keneisha3@users.noreply.github.com' }}
        run: |
          ua=$(jq -r '.inputs.sec_user_agent // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$ua" ]; then echo "::add-mask::$ua"; export SEC_USER_AGENT="$ua"; fi
          python .claude/skills/trader-replay/signals.py 13f --out out
      - uses: actions/upload-artifact@v4
        with:
          name: sig-13f
          path: out/f13.json.gz

  sig-13f-old:
    # one-off (history does not change): the plain-text 13Fs from 1999 to mid 2013
    if: ${{ inputs.mode == 'build-signals' && contains(inputs.skip, 'only-13f-old') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SEC 13F holdings before XML tables
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Keneisha 140374931+Keneisha3@users.noreply.github.com' }}
        run: |
          ua=$(jq -r '.inputs.sec_user_agent // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$ua" ]; then echo "::add-mask::$ua"; export SEC_USER_AGENT="$ua"; fi
          python .claude/skills/trader-replay/signals.py 13f-old --out out
      - uses: actions/upload-artifact@v4
        with:
          name: sig-13f-old
          path: out/f13_old.json.gz

  sig-fundamentals:
    # the upstream analyst's numbers (revenue, operating income, net income, EPS) as first filed
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '23 7 3 * *') || (inputs.mode == 'build-signals' && !contains(inputs.skip, 'fundamentals')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SEC XBRL company facts
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Keneisha 140374931+Keneisha3@users.noreply.github.com' }}
        run: |
          ua=$(jq -r '.inputs.sec_user_agent // ""' "$GITHUB_EVENT_PATH")
          if [ -n "$ua" ]; then echo "::add-mask::$ua"; export SEC_USER_AGENT="$ua"; fi
          python .claude/skills/trader-replay/signals.py fundamentals --out out
      - uses: actions/upload-artifact@v4
        with:
          name: sig-fundamentals
          path: out/fundamentals.json.gz

  sig-save:
    needs: [sig-congress, sig-insiders, sig-events, sig-eps, sig-13f, sig-13f-old, sig-fundamentals]
    if: ${{ always() && ((github.event_name == 'schedule' && (github.event.schedule == '23 7 3 * *' || github.event.schedule == '17 13 * * 6')) || inputs.mode == 'build-signals') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sig-*
          path: out
          merge-multiple: true
      - name: Save to the replay-results branch
        run: |
          ls -la out
          mkdir -p "$RUNNER_TEMP/out" && cp out/* "$RUNNER_TEMP/out/" || true
          git config user.name "replay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin replay-results
          git checkout -q -B replay-results FETCH_HEAD
          mkdir -p signals
          cp "$RUNNER_TEMP"/out/*.json.gz signals/ 2>/dev/null || true
          git add signals
          git commit -qm "Dated signals: Congress trades, insider purchases, 8-K news, EPS" || echo "no change"
          for i in 1 2 3; do git push -q origin replay-results && break; git pull -q --rebase origin replay-results; done

  # ---------------------------------------------------------------- discover
  # Every weekday: snapshot every source (the whole market and the idea lists),
  # rank the whole market, and archive both to replay-results/discover/, so the
  # lists build a dated history that can be backtested later.

  discover:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 22 * * 1-5') || inputs.mode == 'discover' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Snapshot every source, rank the whole market
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'Keneisha 140374931+Keneisha3@users.noreply.github.com' }}
        run: |
          ua=$(jq -r '.inputs.sec_user_agent // ""' "$GITHUB_EVENT_PATH" 2>/dev/null)
          if [ -n "$ua" ]; then echo "::add-mask::$ua"; export SEC_USER_AGENT="$ua"; fi
          python trade.py init
          python trade.py discover snapshot
          python trade.py discover funnel --deep --top 100 > /dev/null
          python trade.py discover show
      - name: Save to the replay-results branch
        run: |
          day=$(date -u +%Y-%m-%d)
          mkdir -p "$RUNNER_TEMP/out"
          cp trader/discover/archive/*.json.gz "$RUNNER_TEMP/out/"
          cp trader/discover/ideas.json "$RUNNER_TEMP/out/ideas-$day.json"
          git config user.name "replay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin replay-results
          git checkout -q -B replay-results FETCH_HEAD
          mkdir -p discover/archive discover/ideas
          cp "$RUNNER_TEMP"/out/*.json.gz discover/archive/
          cp "$RUNNER_TEMP"/out/ideas-*.json discover/ideas/
          cp "$RUNNER_TEMP"/out/ideas-*.json discover/latest-ideas.json
          git add discover
          git commit -qm "Discover snapshot $day" || echo "no change"
          for i in 1 2 3; do git push -q origin replay-results && break; git pull -q --rebase origin replay-results; done

  # ---------------------------------------------------------------- forward
  # The live paper record: every weekday, the frozen plan (forward_plan.json) is
  # brought up to the latest close and appended to replay-results/forward/record.json.
  # Days already on the record are never rewritten.

  forward:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '41 22 * * 1-5') || inputs.mode == 'forward' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bring the live paper record up to today
        run: |
          mkdir -p forward
          git fetch -q origin replay-results || true
          git show origin/replay-results:forward/record.json > forward/record.json 2>/dev/null || rm -f forward/record.json
          mkdir -p "$RUNNER_TEMP/signals"  # the Pelosi copy reads the dated Congress filings
          git show origin/replay-results:signals/congress.json.gz > "$RUNNER_TEMP/signals/congress.json.gz"
          git show origin/replay-results:signals/f13.json.gz > "$RUNNER_TEMP/signals/f13.json.gz"  # the copycat line
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null  # her latest filings
          python .claude/skills/trader-replay/signals.py congress --years "$(date -u +%Y)" --member Pelosi \
            --merge "$RUNNER_TEMP/signals/congress.json.gz" --out "$RUNNER_TEMP/signals" > /dev/null \
            || echo "::warning::could not refresh Pelosi's filings; using the monthly build"
          python .claude/skills/trader-replay/replay.py --forward forward/record.json --signals "$RUNNER_TEMP/signals" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save to the replay-results branch
        run: |
          cp forward/record.json "$RUNNER_TEMP/record.json"
          rm -f forward/record.json  # the results branch has its own copy: an untracked one blocks the switch
          git config user.name "replay-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B replay-results origin/replay-results
          mkdir -p forward
          cp "$RUNNER_TEMP/record.json" forward/record.json
          git add forward
          git commit -qm "Live paper record $(date -u +%Y-%m-%d)" || echo "no change"
          for i in 1 2 3; do git push -q origin replay-results && break; git pull -q --rebase origin replay-results; done
